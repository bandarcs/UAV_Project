<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="2380" viewBox="0 0 1100 1190"><rect width="1100" height="1190" fill="white"/><defs><marker id="arr" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#32645c"/></marker><marker id="open" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L9 5L0 10" fill="none" stroke="#32645c" stroke-width="1.5"/></marker></defs><g font-family="Arial, sans-serif" fill="#203b38" text-anchor="middle"><text x="550.0" y="56.78" font-size="42" fill="#32645c" font-weight="bold">System Flowchart</text><polygon points="550.0,95 667,151.0 550.0,207 433,151.0" fill="#f1f7f5" stroke="#32645c" stroke-width="3.2"/><text x="550.0" y="143.305" font-size="27">Session</text><text x="550.0" y="177.055" font-size="27">mode?</text><rect x="162" y="239" width="358" height="66" rx="16" fill="#f1f7f5" stroke="#32645c" stroke-width="3.2"/><text x="341.0" y="282.2" font-size="30">Live Monitoring</text><rect x="634" y="239" width="386" height="66" rx="16" fill="#f1f7f5" stroke="#32645c" stroke-width="3.2"/><text x="827.0" y="282.2" font-size="30">Periodic Recording</text><rect x="162" y="340" width="358" height="66" rx="16" fill="#f1f7f5" stroke="#32645c" stroke-width="3.2"/><text x="341.0" y="382.52" font-size="28">Stream after takeoff</text><rect x="634" y="340" width="386" height="66" rx="16" fill="#f1f7f5" stroke="#32645c" stroke-width="3.2"/><text x="827.0" y="382.52" font-size="28">Save timestamped clips</text><polygon points="341.0,438 461,504.0 341.0,570 221,504.0" fill="#f1f7f5" stroke="#32645c" stroke-width="3.2"/><text x="341.0" y="496.02" font-size="28">Link</text><text x="341.0" y="531.02" font-size="28">available?</text><rect x="634" y="471" width="386" height="66" rx="16" fill="#f1f7f5" stroke="#32645c" stroke-width="3.2"/><text x="827.0" y="512.84" font-size="26">Admin selects a saved clip</text><rect x="25" y="600" width="338" height="90" rx="16" fill="#f1f7f5" stroke="#32645c" stroke-width="3.2"/><text x="194.0" y="637.875" font-size="25">Record on UAV</text><text x="194.0" y="669.125" font-size="25">until the link returns</text><rect x="25" y="728" width="338" height="90" rx="16" fill="#f1f7f5" stroke="#32645c" stroke-width="3.2"/><text x="194.0" y="765.875" font-size="25">Transfer the missed</text><text x="194.0" y="797.125" font-size="25">video segment</text><rect x="390" y="652" width="348" height="66" rx="16" fill="#f1f7f5" stroke="#32645c" stroke-width="3.2"/><text x="564.0" y="694.86" font-size="29">Read video frames</text><rect x="390" y="751" width="348" height="66" rx="16" fill="#f1f7f5" stroke="#32645c" stroke-width="3.2"/><text x="564.0" y="793.86" font-size="29">Automatic Setup</text><text x="919.0" y="776.945" font-size="23" fill="#203B38" font-weight="normal">Model, image size</text><text x="919.0" y="805.695" font-size="23" fill="#203B38" font-weight="normal">and analysis rate</text><rect x="390" y="850" width="348" height="66" rx="16" fill="#f1f7f5" stroke="#32645c" stroke-width="3.2"/><text x="564.0" y="892.86" font-size="29">Detect Objects</text><rect x="390" y="949" width="348" height="66" rx="16" fill="#f1f7f5" stroke="#32645c" stroke-width="3.2"/><text x="564.0" y="991.86" font-size="29">Track and assign IDs</text><rect x="390" y="1048" width="348" height="66" rx="16" fill="#f1f7f5" stroke="#32645c" stroke-width="3.2"/><text x="564.0" y="1090.86" font-size="29">View, save or print</text><text x="195.5" y="864.98" font-size="22" fill="#203B38" font-weight="normal">Analyse the recovered</text><text x="195.5" y="892.48" font-size="22" fill="#203B38" font-weight="normal">segment before resuming</text><text x="195.5" y="919.98" font-size="22" fill="#203B38" font-weight="normal">live analysis.</text><text x="183.0" y="487.32" font-size="23" fill="#203B38" font-weight="normal">No</text><text x="512.0" y="487.32" font-size="23" fill="#203B38" font-weight="normal">Yes</text><polyline points="433,151 3